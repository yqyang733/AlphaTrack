[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphatrack"
version = "0.1.0"
description = "Reproducible, cash-flow-aware backtesting with offline Plotly reports"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "plotly>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8", "lxml>=5"]
preview = ["lxml>=5", "Pillow>=10"]

[project.scripts]
alphatrack = "alphatrack.cli:main"

[tool.setuptools.packages.find]
include = ["alphatrack*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
