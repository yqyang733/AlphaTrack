<rect x="410" y="285" width="360" height="105" rx="12" fill="white" stroke="#d9c8f4" stroke-width="1.5"/>
<text x="590" y="309" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">原合格候选池</text>
<text x="590" y="337" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">Fundb / Fundc 各自类别</text>
<text x="590" y="365" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">历史数据及评分须有效</text>
<rect x="825" y="275" width="370" height="125" rx="12" fill="#e4d4fa" stroke="#b993e8" stroke-width="2"/>
<text x="1010" y="306" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="650" text-anchor="middle" dominant-baseline="central">Fundb 随机选 8 只</text>
<text x="1010" y="341" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="650" text-anchor="middle" dominant-baseline="central">Fundc 随机选 5 只</text>
<text x="1010" y="377" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">每日重抽 · 不放回 · 可复现</text>
<rect x="1250" y="285" width="450" height="105" rx="12" fill="white" stroke="#d9c8f4" stroke-width="1.5"/>
<text x="1475" y="309" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">入选且当日有新净值</text>
<text x="1475" y="337" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">每只买入 40 元</text>
<text x="1475" y="365" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">当前无自动卖出规则</text>
<text x="410" y="424" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">候选不足时全选；无新净值不下单、不递补，因此实际发单数可能少于 8 / 5。</text>
<rect x="410" y="480" width="360" height="140" rx="18" fill="#eee7fc" stroke="#dfdce8" stroke-width="1.5"/>
<text x="590" y="520" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" text-anchor="middle" dominant-baseline="central">Fundf_1 · 红利低波</text>
<text x="590" y="569" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">p = 近 1 年历史位置</text>
<rect x="825" y="480" width="875" height="140" rx="18" fill="white" stroke="#dfdce8" stroke-width="1.5"/>
<text x="865" y="503" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">50% ≤ p ≤ 60%  →  买 40 元</text>
<text x="865" y="543" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">40% ≤ p &lt; 50%  →  买 80 元</text>
<text x="865" y="583" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">30% ≤ p &lt; 40%  →  买 120 元</text>
<text x="1325" y="521" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">p &lt; 30%  →  买 160 元</text>
<text x="1325" y="569" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">p &gt; 60%  →  不买</text>
<rect x="410" y="654" width="360" height="95" rx="18" fill="#eee7fc" stroke="#dfdce8" stroke-width="1.5"/>
<text x="590" y="680" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" text-anchor="middle" dominant-baseline="central">Fundg · 美股指数</text>
<text x="590" y="719" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">p = 近 1 年历史位置</text>
<rect x="825" y="654" width="875" height="95" rx="18" fill="white" stroke="#dfdce8" stroke-width="1.5"/>
<text x="865" y="683" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" dominant-baseline="central">p ≤ 60%  →  每只买 10 元</text>
<text x="1325" y="683" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400" text-anchor="start" dominant-baseline="central">p &gt; 60%  →  不买</text>
<text x="865" y="721" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">当前无自动卖出规则</text>
<rect x="410" y="940" width="360" height="220" rx="18" fill="#eee7fc" stroke="#dfdce8" stroke-width="1.5"/>
<text x="590" y="976" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="650" text-anchor="middle" dominant-baseline="central">Fundd · 三周期最小值</text>
<text x="590" y="1022" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">x = min(近 5 年、近 10 年、</text>
<text x="590" y="1053" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">成立以来历史位置)</text>
<text x="590" y="1111" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">宽基 B = 50 元；其他 B = 10 元</text>
<rect x="825" y="900" width="390" height="280" rx="18" fill="white" stroke="#dfdce8" stroke-width="1.5"/>
<text x="1020" y="935" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" text-anchor="middle" dominant-baseline="central">买入区：x ≤ 20%</text>
<text x="853" y="987" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">10% ≤ x ≤ 20%  →  买 1 × B</text>
<text x="853" y="1024" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">5% ≤ x &lt; 10%  →  买 2 × B</text>
<text x="853" y="1061" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">0 &lt; x &lt; 5%  →  买 3 × B</text>
<text x="853" y="1098" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="start" dominant-baseline="central">x ≤ 0  →  买 4 × B</text>
<text x="1020" y="1148" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">20% &lt; x &lt; 50%：不买、不卖</text>
<rect x="1270" y="900" width="430" height="280" rx="18" fill="white" stroke="#dfdce8" stroke-width="1.5"/>
<text x="1485" y="935" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" text-anchor="middle" dominant-baseline="central">卖出区：x ≥ 50%</text>
<text x="1294" y="983" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">50%—100% 等距设置 50 档</text>
<text x="1294" y="1015" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">每档本轮触发一次；跨档合并</text>
<text x="1294" y="1047" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">档位越高，分配卖出的份额越多</text>
<text x="1294" y="1079" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">完整比例计划：卖 90%，留 10%</text>
<text x="1294" y="1123" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">再进入买入区间 → 重置档位</text>
<text x="1294" y="1154" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central">没有“必须盈利才卖”的硬条件</text>
<text x="410" y="1234" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">指标不足时不交易；卖出比例按执行时持有份额计算，沿用原状态与分档规则。</text>
<text x="50" y="1322" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="650" text-anchor="start" dominant-baseline="central">共同执行口径</text>
<text x="225" y="1322" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">独立空仓开始 · 无限资金追加 · 卖出款取出 · 下一可用净值成交</text>
<text x="50" y="1365" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central">沿用原净值观察日历与数据资格条件；随机种子与类别、日期、基金代码共同确定每日抽样。</text>
</svg>