<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420">
<title>AlphaStep · 随机选基版（策略二）</title>
<desc>仅将Fundb前8与Fundc前5的评分排序改为每日随机选择，其他交易规则不变。</desc>
<rect width="1800" height="1420" fill="#f6f7fb"/>
<text x="50" y="66" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="40" font-weight="650" text-anchor="start" dominant-baseline="central">AlphaStep · 随机选基版（策略二）</text>
<text x="52" y="118" fill="#6d687e" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="start" dominant-baseline="central">只替换 Fundb / Fundc 的选基顺序；其余买卖规则、资金口径与成交机制保持一致。</text>
