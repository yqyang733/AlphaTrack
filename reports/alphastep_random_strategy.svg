<text x="175" y="602" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">更新历史指标</text>
<text x="175" y="634" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">逐基金判断</text>
<text x="175" y="666" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">数据不足 → 不交易</text>
<rect x="390" y="245" width="1335" height="205" rx="15" fill="#f1eafb" stroke="#bfa2ed" stroke-width="2"/>
<text x="410" y="263" fill="#7546d9" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="650" text-anchor="start" dominant-baseline="central">本次唯一修改：评分排名 → 每日随机选择</text>
<polyline points="390,335 410,335" fill="none" stroke="#a9a3ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
