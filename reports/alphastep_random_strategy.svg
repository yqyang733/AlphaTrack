<rect x="365" y="810" width="1385" height="460" rx="20" fill="#faf9fd" stroke="#ddd8e8" stroke-width="1.5"/>
<text x="395" y="844" fill="#2b2441" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="650" text-anchor="start" dominant-baseline="central">② Fundd：低位分档买，高位分档卖</text>
